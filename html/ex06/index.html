<body>
    <h1>links externos</h1>
    <p>Links externos são links que direcionam o usuário para um site diferente do atual.</p>
    <a href="https://www.google.com" target="_blank" rel="external">Visitar o Google</a>
    <h2>links internos</h2>
     <p>Links internos são links que direcionam o usuário para uma página dentro do mesmo site.</p>
     <p> essa é a minha pagina principal: <a href="pag02.html" rel="next">clique aqui para ir para a página 02</a></p>

</body>
